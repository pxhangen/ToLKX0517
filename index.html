<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#030511">
<title>烟花祝福</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030511;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.ui{position:fixed;inset:0;pointer-events:none;color:#fff;text-align:center;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}
.title{position:absolute;top:17%;left:0;right:0;font-size:clamp(28px,8vw,48px);font-weight:700;letter-spacing:.16em;text-shadow:0 0 18px #ff6bd6,0 0 42px #7c5cff;animation:float 3s ease-in-out infinite}
.sub{position:absolute;top:25%;left:0;right:0;font-size:13px;letter-spacing:.3em;opacity:.72}
.tip{position:absolute;bottom:10%;left:0;right:0;font-size:14px;opacity:.72;letter-spacing:.15em;animation:pulse 2s infinite}
button{pointer-events:auto;position:absolute;bottom:calc(4% + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);backdrop-filter:blur(12px);color:#fff;border-radius:999px;padding:10px 20px;font-size:13px}
@keyframes float{50%{transform:translateY(-8px)}}@keyframes pulse{50%{opacity:.35}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div class="title">愿你所愿皆如愿</div>
  <div class="sub">烟 火 · 向 晚 · 皆 是 欢 喜</div>
  <div class="tip">点击屏幕 · 点亮一场烟火</div>
  <button id="auto">暂停烟花</button>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),D=devicePixelRatio||1;
let W,H,auto=true,rockets=[],parts=[],stars=[];
function resize(){W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);stars=Array.from({length:Math.min(100,Math.floor(W*H/7000))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,a:Math.random()}))}
addEventListener('resize',resize);resize();
const colors=['#ff4f81','#ffcf4a','#6dfcff','#b67cff','#72ff9c','#ffffff','#ff8b4d'];
function launch(tx=Math.random()*W,ty=H*(.18+Math.random()*.3)){
 let sx=W*(.15+Math.random()*.7); rockets.push({x:sx,y:H+10,tx,ty,v:Math.min(15,H/55),col:colors[Math.random()*colors.length|0]});
}
function burst(px,py,col){
 const n=110+Math.random()*70|0;
 for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=(Math.random()**.45)*(3+Math.random()*7);parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:45+Math.random()*55,max:100,col,sz:Math.random()*2+1,drag:.985+Math.random()*.008,g:Math.random()*.055+.035})}
 for(let i=0;i<20;i++){let a=Math.random()*6.28,s=1+Math.random()*4;parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:25+Math.random()*20,max:45,col:'#fff',sz:2.2,g:.04})}
}
function draw(){
 x.fillStyle='rgba(2,4,18,.22)';x.fillRect(0,0,W,H);
 for(const s of stars){s.a+=.015; x.globalAlpha=.25+.25*Math.sin(s.a);x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill()} x.globalAlpha=1;
 for(let i=rockets.length-1;i>=0;i--){let r=rockets[i],dx=r.tx-r.x,dy=r.ty-r.y,d=Math.hypot(dx,dy);r.x+=dx/d*r.v;r.y+=dy/d*r.v;
   for(let j=0;j<3;j++){parts.push({x:r.x,y:r.y,vx:(Math.random()-.5),vy:Math.random(),life:12,max:12,col:r.col,sz:1.4,g:.02})}
   if(d<r.v+3){burst(r.x,r.y,r.col);rockets.splice(i,1)}
 }
 for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=p.drag;p.vy=p.vy*p.drag+p.g;p.life--;
   x.globalAlpha=Math.max(0,p.life/p.max);x.fillStyle=p.col;x.shadowBlur=12;x.shadowColor=p.col;x.beginPath();x.arc(p.x,p.y,p.sz,0,6.28);x.fill();
   if(p.life<=0)parts.splice(i,1)
 } x.globalAlpha=1;x.shadowBlur=0;requestAnimationFrame(draw);
}
setInterval(()=>{if(auto)launch()},700);setTimeout(()=>launch(W*.5,H*.28),300);setTimeout(()=>launch(W*.25,H*.34),650);setTimeout(()=>launch(W*.75,H*.32),1000);
c.addEventListener('pointerdown',e=>{launch(e.clientX,e.clientY);if(navigator.vibrate)navigator.vibrate(12)});
document.getElementById('auto').onclick=e=>{auto=!auto;e.target.textContent=auto?'暂停烟花':'开启烟花'};
draw();
</script>
</body>
</html>
